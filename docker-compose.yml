services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-philately}
      POSTGRES_USER: ${POSTGRES_USER:-philately}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-philately}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - postgres

  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

volumes:
  postgres_data:
  grafana_data:
